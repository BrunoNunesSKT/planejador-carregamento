<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Planejador de Carregamento | DSV Transporte Hortolândia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600&display=swap">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#10273a;--mut:#5b7183;--ln:#ccd6de;--ac:#002664;--acx:#fff;--bad:#b42318;--ok:#17703a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c151d;--card:#14212c;--ink:#e6eef4;--mut:#8da3b3;--ln:#27394a;--ac:#7fa8ee;--acx:#06202f;--bad:#ff8a7a;--ok:#6fd08f}}
:root[data-theme=dark]{--bg:#0c151d;--card:#14212c;--ink:#e6eef4;--mut:#8da3b3;--ln:#27394a;--ac:#7fa8ee;--acx:#06202f;--bad:#ff8a7a;--ok:#6fd08f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Barlow Semi Condensed',system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.hd{background:#002664;color:#fff;margin:-14px -14px 14px;padding:14px 16px;display:flex;align-items:center;gap:14px;border-radius:0 0 12px 12px}.hd>b{font-size:36px;letter-spacing:.03em;font-weight:600;line-height:1;padding-right:14px;border-right:2px solid #fff6}.hd>img{height:30px;width:auto;padding-right:14px;border-right:2px solid #fff6}.hd span{display:block;font-size:14px;opacity:.85}h1{font-size:19px;line-height:1.15;margin:0;font-weight:600}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.r{display:flex;gap:8px;align-items:flex-end}
label{display:block;font-size:13px;color:var(--mut);flex:1;min-width:0}
input,select{width:100%;font:inherit;font-size:17px;padding:9px 8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);margin-top:3px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:13px 14px;background:var(--ac);color:var(--acx)}
button.g{background:none;color:var(--ac);border:1px solid var(--ln);padding:8px 10px;font-size:14px}
button.x{background:none;color:var(--mut);padding:9px 6px;font-size:22px;line-height:1}
.t{flex:none;width:28px;height:40px;border-radius:5px;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
#calc{width:100%;font-size:18px}
.big{font-size:34px;font-weight:600;line-height:1.1}.big small{font-size:17px;font-weight:400;color:var(--mut)}
.m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.m b{display:block;font-size:20px}.m span{font-size:13px;color:var(--mut)}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.bp{background:#002664;border-radius:10px;padding:8px;margin-bottom:12px}
.lg{display:flex;gap:8px;align-items:center;margin:6px 0}
.lg i{width:16px;height:16px;border-radius:3px;flex:none}
.n{font-size:13px;color:var(--mut)}
#err{color:var(--bad);margin:8px 0 0}
</style></head><body><main>
